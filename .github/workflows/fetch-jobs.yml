name: Fetch jobs

on:
  schedule:
    - cron: "17 5 * * *"   # every day 08:17 Istanbul time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: cd scripts && python fetch_jobs.py
      - name: Commit
        run: |
          git config user.name "job-agent"
          git config user.email "job-agent@users.noreply.github.com"
          git add docs/data/jobs.json
          git commit -m "Daily job scan" || exit 0
          git pull --rebase && git push
