name: Fetch jobs

# Daily: scan sources, then write packages for the best new matches (free GitHub Models).
# Packages wait on the site until you approve them.
on:
  schedule:
    - cron: "17 5 * * *"   # every day 08:17 Istanbul time
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 reportlab && sudo apt-get install -y -qq fonts-dejavu-core >/dev/null
      - run: cd scripts && python fetch_jobs.py
      - name: Prepare packages for top matches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODEL: ${{ vars.GH_MODEL }}
        run: |
          cd scripts && python auto_prepare.py
          for f in ../docs/data/applications/*.json; do
            id=$(basename "$f" .json); [ "$id" = "index" ] && continue
            [ -f "../docs/data/applications/$id-cover-letter.pdf" ] || python cover_letter_pdf.py "$f" "../docs/data/applications/$id-cover-letter.pdf"
          done
      - name: Commit
        run: |
          git config user.name "job-agent"
          git config user.email "job-agent@users.noreply.github.com"
          git add docs/data
          git commit -m "Daily job scan and packages" || exit 0
          git pull --rebase && git push
