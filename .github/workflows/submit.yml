name: Submit application

# The site's "Onayla ve gönder" button opens an issue titled "submit: PACKAGE_ID".
# Only the repo owner's issues run. Email goes out via Gmail SMTP, forms via headless Chromium.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  submit:
    if: (startsWith(github.event.issue.title, 'submit:') || startsWith(github.event.issue.title, 'test:')) && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    env:
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      DOCS_PASSPHRASE: ${{ secrets.DOCS_PASSPHRASE }}
      CONTACT_LINE: ${{ secrets.CONTACT_LINE }}
      APPLICANT_JSON: ${{ secrets.APPLICANT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install requests beautifulsoup4 reportlab playwright
          sudo apt-get install -y -qq fonts-dejavu-core gnupg >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
      - name: Submit
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          ID=$(echo "$TITLE" | sed -E 's/^(submit|test):[[:space:]]*//; s/[[:space:]].*$//')
          DRY=""; case "$TITLE" in test:*) DRY="--dry-run";; esac
          cd scripts && python submit.py --id "$ID" --summary-out ../summary.md $DRY
      - name: Commit
        if: always()
        run: |
          git config user.name "job-agent"
          git config user.email "job-agent@users.noreply.github.com"
          git add docs/data/applications
          git commit -m "Submission result" || exit 0
          git pull --rebase && git push
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f summary.md ] || echo "❌ Gönderim adımı çalışmadı, Actions loglarına bak." > summary.md
          gh issue comment ${{ github.event.issue.number }} --body-file summary.md
          gh issue close ${{ github.event.issue.number }}
